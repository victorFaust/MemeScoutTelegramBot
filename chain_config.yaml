# chain_config.yaml -- Per-chain filter thresholds and safety check settings.
# Only Solana and Robinhood Chain are active.
# Any chain in CHAINS (.env) without an entry here will use "default".

default:
  poll_interval_seconds: 180
  min_liquidity_usd: 5000
  max_liquidity_usd: 50000
  max_market_cap: 500000
  max_pair_age_hours: 168
  min_volume_liquidity_ratio: 0.5
  min_price_change_1h: 0.0
  min_price_change_6h: 0.0
  min_buy_sell_ratio: 1.0
  min_txns_1h: 10
  min_alert_score: 50
  momentum_realert_threshold: 15

  weights:
    liquidity: 12
    market_cap: 12
    pair_age: 8
    vol_liq_ratio: 18
    price_change: 18
    buy_sell_ratio: 17
    velocity: 15

  safety:
    max_buy_tax_pct: 10
    max_sell_tax_pct: 10
    max_top10_holder_pct: 70
    reject_honeypot: true
    reject_mint_authority: true
    reject_blacklist: true

solana:
  poll_interval_seconds: 180
  min_liquidity_usd: 15000       # raised from 3000 -- sub-$15K pools are rug territory
  max_liquidity_usd: 200000
  max_market_cap: 2000000
  max_pair_age_hours: 72         # raised from 168 -- focus on newer tokens
  min_volume_liquidity_ratio: 0.5  # raised from 0.3
  min_price_change_1h: 5.0      # raised from -5 -- require positive 1h momentum
  min_price_change_6h: -5.0
  min_buy_sell_ratio: 1.2        # raised from 1.0 -- stronger buying pressure required
  min_txns_1h: 25               # raised from 8 -- real interest means real volume
  min_alert_score: 58           # raised from 40 -- only alert on strong signals
  momentum_realert_threshold: 8
  min_rugcheck_score: 0.5
  min_lp_locked_pct: 50
  max_top1_holder_pct: 40
  min_buy_quality: 0.15
  min_pool_txns_1h: 25
  reject_serial_deployers: true

  weights:
    liquidity: 12
    market_cap: 12
    pair_age: 8
    vol_liq_ratio: 18
    price_change: 18
    buy_sell_ratio: 17
    velocity: 15

  safety:
    max_buy_tax_pct: 10
    max_sell_tax_pct: 10
    max_top10_holder_pct: 70
    reject_honeypot: true
    reject_mint_authority: true
    reject_blacklist: true
